<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% assign heading = content | split: "</h1>" | first | split: ">" | last | strip_html | strip %}
  <title>{{ heading | default: site.title }}</title>
  <meta property="og:title" content="{{ heading | default: site.title }}">
  <meta property="og:image" content="{{ '/results/figures/class_incremental_head_resets.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
</head>
<body>
  <main class="page">
    {{ content }}
    <footer>
      <a href="https://github.com/JayZenith/CL">github.com/JayZenith/CL</a>
    </footer>
  </main>
</body>
</html>
